# Production stack for Oracle Cloud VPS (or any host with Docker).
# Usage:
#   cp deploy/env.example deploy/.env
#   # edit deploy/.env — set secrets, NEXT_PUBLIC_* to your public URLs
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  postgres:
    image: postgres:15
    container_name: goldbot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldbot}
      POSTGRES_USER: ${POSTGRES_USER:-goldbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldbot} -d ${POSTGRES_DB:-goldbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [appnet]

  redis:
    image: redis:7
    container_name: goldbot-redis
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [appnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goldbot-backend
    env_file:
      - deploy/.env
    environment:
      PORT: "8080"
    # Optional: override host/port for migrations when DATABASE_URL_* is in env_file only
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # Optional: only for split-host WS (e.g. wss://api.example.com/ws). Empty = same origin as UI.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    container_name: goldbot-frontend
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks: [appnet]

  # Single entry port: proxies /ws and /api to FastAPI (WS cannot use Next.js rewrites).
  gateway:
    image: nginx:alpine
    container_name: goldbot-gateway
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
